<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | GGC Construcciones SpA</title>
    <link rel="stylesheet" href="design-system/styles.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container header-container">
            <h1 class="logo">
                <span class="logo-mark">GGC</span>
                <span class="logo-kicker">Construcciones SpA</span>
            </h1>
            <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="primary-nav" aria-label="Abrir menú">
                <span class="nav-toggle-bar"></span>
                <span class="nav-toggle-bar"></span>
                <span class="nav-toggle-bar"></span>
            </button>
            <nav>
                <ul class="nav-links" id="primary-nav">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="nosotros.html">Nosotros</a></li>
                    <li><a href="servicios.html">Servicios</a></li>
                    <li><a href="proyectos.html">Proyectos</a></li>
                    <li><a href="contacto.html" class="active btn-primary-small">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="page-title">
            <div class="container">
                <h2>Conversemos sobre tu proyecto</h2>
                <p>Nuestro equipo está listo para asesorarte técnica y comercialmente.</p>
            </div>
        </section>

        <section class="contact-section container">
            <form class="contact-form">
                <div class="form-group">
                    <label for="nombre">Nombre o Empresa</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="mensaje">Detalles del Proyecto</label>
                    <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
                </div>
                <button type="submit" class="btn-primary">Enviar Mensaje</button>
            </form>
        </section>
    </main>

    <footer>
        <div class="container footer-container">
            <nav>
                <ul class="footer-links" id="footer-nav">
                    <li><a href="interno.html" class="btn-footer-interno">Acceso Interno</a></li>
                </ul>
            </nav>
        </div>
        <div class="container">
            <p>&copy; 2026 GGC Construcciones SpA. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="assets/nav.js"></script>
</body>
</html>
